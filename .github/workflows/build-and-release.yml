name: Build and Release MIRA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MIRA-Windows.zip
            platform: windows
          - os: macos-latest
            artifact_name: MIRA-macOS.zip
            platform: macos
          - os: ubuntu-22.04
            artifact_name: MIRA-Linux.tar.gz
            platform: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libportaudio2 libasound2-dev libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller mira.spec

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MIRA/* -DestinationPath MIRA-Windows.zip

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          # Usa ditto per preservare i permessi e i symlink del bundle .app
          ditto -c -k --sequesterRsrc --keepParent dist/MIRA.app MIRA-macOS.zip

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          # Preserva i permessi di esecuzione POSIX
          tar -czvf MIRA-Linux.tar.gz -C dist MIRA

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
